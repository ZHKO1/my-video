name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装 uv（项目用这个管理依赖）
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.0"

      # 设置 Python 版本，从 .python-version 读取（当前是 3.13）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # 安装 uv 后会自动处理依赖，这里不需要显式 uv sync。
      # 下面的每个 step 都用 --no-default-groups，避免安装 torch / whisperx / demucs / yt-dlp 等重型依赖。

      # 运行 Ruff 静态检查（只装 dev 组里的 ruff）
      - name: Run Ruff check
        run: uv run --no-default-groups --group dev ruff check .

      # 检查 Ruff 格式化是否符合规范
      - name: Check Ruff format
        run: uv run --no-default-groups --group dev ruff format --check .

      # 运行 pytest 测试（只装 test 组里的轻量依赖）
      - name: Run pytest
        run: uv run --no-default-groups --group test pytest
