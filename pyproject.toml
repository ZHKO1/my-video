[project]
name = "my-video"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp[default]>=2025.7.21",
]

[project.scripts]
my-video = "my_video.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
