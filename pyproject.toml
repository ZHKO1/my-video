[project]
name = "my-video"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    'audioop-lts; python_version >= "3.13"',
    "numpy>=2.2.6",
    "opencv-python>=4.10.0.84",
    "json-repair>=0.39.1",
    "openpyxl>=3.1.5",
    "openai>=1.55.3,<2",
    "pandas>=2.2.3",
    "pydub>=0.25.1",
    "rapidfuzz>=3.14.0",
    "tenacity>=8.2.0",
    "diskcache>=5.6.3",
    "torch>=2.8.0",
    "whisperx>=3.8.5",
    "demucs[dev] @ git+https://github.com/adefossez/demucs",
    "yt-dlp[default]>=2025.7.21",
]

[project.scripts]
my-video = "my_video.cli.main:main"

[dependency-groups]
# 开发日常依赖：测试、格式化、pre-commit
dev = ["pytest>=8.0", "ruff>=0.4", "pre-commit>=4.0"]

# 轻量测试依赖：运行核心单元测试所需，但不包含 torch / whisperx / demucs / yt-dlp 等重型依赖。
# 用法：uv run --no-default-groups --group test pytest
# 这样可以在不安装完整项目依赖的情况下快速跑测试。
test = [
    "pytest>=8.0",
    "openai>=1.55.3,<2",
    "tenacity>=8.2.0",
    "diskcache>=5.6.3",
    "rapidfuzz>=3.14.0",
    "json-repair>=0.39.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
override-dependencies = [
    "torchaudio>=2.8.0",  # 强制覆盖 demucs 的 torchaudio<2.2
]

# ==================== Ruff 配置 ====================
# 官方文档：https://docs.astral.sh/ruff/

[tool.ruff]
# Ruff 面向的 Python 版本。
# 和项目 requires-python = ">=3.13,<3.14" 保持一致，避免建议使用旧版语法。
target-version = "py313"

# 单行最大字符数。formatter 和 linter 都会参考。
# 88 是 Black 默认值；如果喜欢更宽可改成 100 或 120。
line-length = 88

[tool.ruff.lint]
# 启用的规则集。下面这套覆盖最常见的问题，建议先跑通再逐步加严格规则。
select = [
    "E",    # pycodestyle errors：缩进、空格、语法风格等基础错误
    "W",    # pycodestyle warnings：行尾空格、多余空行等
    "F",    # Pyflakes：未使用导入、未定义变量、重复导入等
    "I",    # isort：import 分组与排序（解决你最初的问题）
    "N",    # pep8-naming：类/函数/变量命名规范
    "UP",   # pyupgrade：把旧语法升级到 target-version 支持的新语法
    "B",    # flake8-bugbear：常见 Bug 陷阱，如可变默认参数
    "C4",   # flake8-comprehensions：推导式优化建议
    "SIM",  # flake8-simplify：简化复杂表达式
    "RUF",  # Ruff 专属规则，包含一些很实用的检查
    # 下面的规则更严格，如果初次启用报错太多，可以先注释掉：
    # "S",    # flake8-bandit：安全问题，如硬编码密码、不安全的 eval
    # "PL",   # Pylint 规则：更深层的代码质量检查
]

# 明确忽略的规则。
ignore = [
    "E501",   # line-too-long：formatter 会自动处理换行，lint 不必重复报错
    "RUF012", # 可变类属性应标注 ClassVar：对当前项目可能过于严格
    # 下面是中文项目常见误报：Ruff 把中文全角标点当成“有歧义的 Unicode 字符”。
    # 由于本项目注释/文档字符串/字符串中需要正常使用中文标点，直接忽略。
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

# 允许 Ruff 自动修复所有可修复的问题。
fixable = ["ALL"]

[tool.ruff.lint.isort]
# 告诉 Ruff "my_video" 是本地项目包。
# import 排序时会分成三组：标准库 → 第三方库 → my_video，不会混在一起。
known-first-party = ["my_video"]

# 把同一个模块的多个 import 合并成一行带括号的形式，避免重复 from xxx import。
# 例如：
#   from my_video.core.workspace import (
#       build_workspace_paths,
#       create_workspace,
#   )
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
# 文档字符串风格约定。可选 "google" / "numpy" / "pep257"。
# 这里选 google，和国内大多数项目习惯一致。
convention = "google"

# 按文件路径设置不同规则，避免测试代码、脚本、旧模块被过度约束。
[tool.ruff.lint.per-file-ignores]
# 测试文件允许使用 assert（pytest 风格），也允许一些“魔法数字”。
# 注意：S101 / PLR2004 需要在上面的 select 里启用 S / PL 规则才生效。
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
# pytest 自定义标记
markers = [
    "slow: 运行较慢的测试（如需要下载模型、调用外部 API 等）",
    "requires_whisperx: 需要 whisperx / torch 的测试",
    "requires_ytdlp: 需要 yt-dlp 的测试",
    "requires_demucs: 需要 demucs 的测试",
]

[tool.ruff.format]
# 字符串引号风格：double 表示优先使用双引号，和 Black 保持一致。
quote-style = "double"

# 缩进使用空格，符合 PEP 8。
indent-style = "space"

# 是否对文档字符串里的代码示例也做格式化。false 表示只处理普通代码字符串。
docstring-code-format = false
