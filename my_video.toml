work_dir = "~/work/my-video"

[llm]
model = "deepseek-v4-pro"

[download]
cookie_path = "./cookies.txt"
proxy = "socks5://192.168.71.5:20170/"

[transcribe]
demucs = true

[transcribe.whisperx]
language = "en"
model = "large-v3"
model_dir = ""

[subtitle]
thread_num = 4
batch_size = 20
max_word_count_english = 12
max_word_count_cjk = 18
need_reflect = true

target_language = "zh"
split_by_meaning = true
generate_summary = true
split_for_sub = true
max_split_length = 20
max_workers = 4
summary_length = 8000
max_length = 75
target_multiplier = 1.0



[subtitle.translate]
chunk_size = 600
max_lines_per_chunk = 10
min_trim_duration = 3.5

[synthesize]
ffmpeg_gpu = false
