# pre-commit 配置
# 安装：uv run pre-commit install
# 卸载：uv run pre-commit uninstall
# 手动跑：uv run pre-commit run --all-files

# 使用 repo: local，让 pre-commit 直接调用项目环境里已经装好的 ruff，
# 避免从 GitHub 再下载一份 ruff。
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
