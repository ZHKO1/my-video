work_dir = "~/work/my-video"

[llm]
model = "deepseek-v4-flash"

[download]
cookie_path = "./cookies.txt"
proxy = "socks5://192.168.71.5:20170/"

[transcribe]
demucs = true

[transcribe.whisperx]
language = "en"
model = "large-v3"
model_dir = ""

[subtitle]
thread_num = 4
batch_size = 20
max_word_count_english = 14
max_word_count_cjk = 22
max_sentence_word_count_english = 50
max_sentence_word_count_cjk = 50
need_reflect = true

[subtitle.translate]
chunk_size = 600
max_lines_per_chunk = 10
min_trim_duration = 3.5

[synthesize]
ffmpeg_gpu = true
